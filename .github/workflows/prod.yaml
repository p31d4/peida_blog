name: Build, Test and Deploy to Prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: peida_blog
  IMAGE_TAG: latest
  REMOTE_DIR: /root/peida_blog

jobs:
  build-test-rust:
    name: Rust project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: p31d4/dx_devenv:0.1

    steps:
      - uses: actions/checkout@v4

      - name: Run cargo check
        run: cargo check --no-default-features --features web

      - name: Build and test
        run: |
          cargo test --no-default-features --features web --verbose
          dx build --platform server --release

  deploy:
    needs: build-test-rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: |
            p31d4/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            p31d4/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image to tar.gz
        run: |
          docker save \
            p31d4/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            p31d4/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            | gzip > image.tar.gz
          ls -lh image.tar.gz

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_DROPLET }}

      - name: Trust remote host
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure remote deploy directory exists
        run: |
          ssh ${{ secrets.SSH_USER_DROPLET }}@${{ secrets.SSH_HOST_DROPLET }} \
            "mkdir -p ${{ env.REMOTE_DIR }}"

      - name: Copy image and compose file to remote
        run: |
          scp -o ServerAliveInterval=30 \
            image.tar.gz \
            docker-compose.yaml \
            ${{ secrets.SSH_USER_DROPLET }}@${{ secrets.SSH_HOST_DROPLET }}:${{ env.REMOTE_DIR }}/

      - name: Deploy on remote host
        run: |
          ssh ${{ secrets.SSH_USER_DROPLET }}@${{ secrets.SSH_HOST_DROPLET }} bash -s <<EOF
            set -euo pipefail
            cd ${{ env.REMOTE_DIR }}

            echo "==> Stopping and removing previous container..."
            docker-compose down --remove-orphans || true

            echo "==> Loading new image..."
            gunzip -c image.tar.gz | docker load
            rm image.tar.gz

            echo "==> Starting new container..."
            docker-compose up -d

            echo "==> Status"
            docker-compose ps
          EOF
